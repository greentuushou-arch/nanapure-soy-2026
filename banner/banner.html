<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ななぷれselectshop SOY2026 投票バナー 1600×311</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@page{size:1600px 311px;margin:0}
:root{--navy:#0b2e57;--night:#061a33;--sky:#7cc4ff;--sky-l:#cfe8ff;--red:#d7263d;--red-d:#a3172a;--red-grad:linear-gradient(180deg,#ef4a5e 0%,#d7263d 55%,#b01b30 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:311px;overflow:hidden;background:var(--night)}
body{font-family:"Noto Sans JP",sans-serif;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bn{position:relative;width:1600px;height:311px;overflow:hidden;display:grid;grid-template-columns:250px 1fr 680px;align-items:center;padding:0 46px 0 40px;background:radial-gradient(40% 90% at 22% 50%,rgba(215,38,61,.28) 0%,transparent 70%),radial-gradient(120% 140% at 45% 50%,#173f78 0%,#0b2e57 45%,#061a33 100%)}
.snow{position:absolute;border-radius:50%;background:#fff}
.l,.c,.r{position:relative;z-index:1}
.l svg{width:230px;height:auto;display:block}
.c{text-align:center}
.c .soy{font-family:"Jost",sans-serif;font-weight:500;font-size:22px;letter-spacing:.16em;color:var(--sky-l);white-space:nowrap}
.c .soy b{font-weight:600;font-size:1.35em;letter-spacing:.06em;margin-left:.3em;color:#fff}
.c .ttl{font-weight:900;font-size:94px;line-height:1.1;white-space:nowrap;margin-top:4px}
.c .shop{display:inline-block;margin-top:10px;font-weight:700;font-size:21px;letter-spacing:.12em;padding:2px 18px;border-top:1.5px solid rgba(124,196,255,.55);border-bottom:1.5px solid rgba(124,196,255,.55)}
.pt{border:1.5px solid var(--sky);border-radius:16px;background:rgba(6,26,51,.55);padding:14px 22px 18px;text-align:center;line-height:1.35;white-space:nowrap}
.pt .a{font-weight:900;font-size:40px}
.pt .a b{font-family:"Jost",sans-serif;font-weight:600;font-size:1.5em;color:var(--sky)}
.pt .a small{font-size:.75em}
.pt .b{font-weight:700;font-size:31px;margin-top:4px}
.pt .b b{font-family:"Jost",sans-serif;font-weight:600;font-size:1.25em;color:var(--sky)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px;white-space:nowrap}
.dl{font-weight:700;font-size:23px;color:rgba(255,255,255,.88)}
.dl b{font-family:"Jost",sans-serif;font-weight:600;font-size:1.4em;color:#fff}
.cta{display:inline-flex;align-items:center;gap:10px;border-radius:999px;background:var(--red-grad);color:#fff;font-weight:700;font-size:27px;letter-spacing:.08em;padding:11px 14px 11px 32px;box-shadow:0 5px 0 var(--red-d)}
.cta i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#fff;color:var(--red);font-style:normal;font-size:15px}
</style>
</head>
<body>
<div class="bn" id="bn">

  <div class="l">
    <!-- ページと同じギフトボックス型の投票箱（封筒が投入口に入るところ） -->
    <svg viewBox="0 -70 260 300" aria-hidden="true">
      <defs>
        <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a63c9"/><stop offset="1" stop-color="#123f94"/></linearGradient>
        <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8fe6"/><stop offset="1" stop-color="#2a63c9"/></linearGradient>
        <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e3378"/><stop offset="1" stop-color="#0a2552"/></linearGradient>
        <linearGradient id="gRib" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4a5e"/><stop offset="1" stop-color="#b01b30"/></linearGradient>
        <clipPath id="slot"><rect x="0" y="-80" width="260" height="141"/></clipPath>
      </defs>
      <ellipse cx="128" cy="222" rx="118" ry="7" fill="rgba(0,0,0,.4)"/>
      <polygon points="184,70 228,44 228,188 184,214" fill="url(#gSide)"/>
      <polygon points="184,128 228,102 228,120 184,146" fill="url(#gRib)"/>
      <rect x="24" y="70" width="160" height="144" rx="3" fill="url(#gFront)"/>
      <rect x="130" y="70" width="20" height="144" fill="url(#gRib)"/>
      <rect x="24" y="128" width="160" height="18" fill="url(#gRib)"/>
      <text x="77" y="112" text-anchor="middle" font-family="Jost,sans-serif" font-weight="600" font-size="22" letter-spacing="3" fill="#ffffff">VOTE</text>
      <text x="77" y="178" text-anchor="middle" font-family="Jost,sans-serif" font-weight="500" font-size="9" letter-spacing="1.6" fill="rgba(255,255,255,.8)">SHOP OF THE YEAR</text>
      <text x="77" y="194" text-anchor="middle" font-family="Jost,sans-serif" font-weight="600" font-size="13" letter-spacing="2" fill="#cfe8ff">2026</text>
      <polygon points="24,70 184,70 228,44 68,44" fill="url(#gTop)"/>
      <polygon points="130,70 150,70 194,44 174,44" fill="url(#gRib)"/>
      <polygon points="48,64 112,64 120,58 56,58" fill="#061a33"/>
      <g clip-path="url(#slot)">
        <rect x="54" y="-34" width="56" height="96" rx="3" fill="#fff"/>
        <path d="M54 -34 L82 -8 L110 -34" fill="none" stroke="#d6e4f5" stroke-width="2"/>
        <path d="M82 -2 c-4 -6 -12 -4 -12 2 c0 6 8 10 12 14 c4 -4 12 -8 12 -14 c0 -6 -8 -8 -12 -2z" fill="#d7263d"/>
      </g>
      <line x1="49" y1="64.6" x2="111" y2="64.6" stroke="rgba(255,255,255,.45)" stroke-width="1.2"/>
    </svg>
  </div>

  <div class="c">
    <p class="soy">RAKUTEN SHOP OF THE YEAR<b>2026</b></p>
    <p class="ttl">投票受付中</p>
    <p class="shop">ななぷれselectshop</p>
  </div>

  <div class="r">
    <div class="pt">
      <p class="a">最大<b>10,000</b><small>ポイント</small>！</p>
      <p class="b">合計<b>10</b>万名様に当たる！</p>
    </div>
    <div class="meta"><p class="dl">投票は<b>11.30</b>(月)09:59まで</p><span class="cta">投票はこちら<i>▶</i></span></div>
  </div>
</div>
<script>
(function(){
  // 背景にうすい雪の粒
  var bn = document.getElementById('bn');
  [[4,14,5],[12,80,4],[30,10,3],[36,88,5],[47,18,4],[55,84,3],[60,8,5],[96,12,4],[98,86,5],[1,58,3]].forEach(function(p){
    var s = document.createElement('span'); s.className = 'snow';
    s.style.cssText = 'left:' + p[0] + '%;top:' + p[1] + '%;width:' + p[2] + 'px;height:' + p[2] + 'px;opacity:' + (.35 + p[2] / 20);
    bn.insertBefore(s, bn.firstChild);
  });
  // ?w=2000 のように幅を指定すると、縦横比を保ったまま拡大する
  var m = location.search.match(/w=(\d+)/);
  if (!m) return;
  var Z = +m[1] / 1600, W = Math.ceil(1600 * Z), H = Math.ceil(311 * Z);
  bn.style.zoom = Z;
  var st = document.createElement('style');
  st.textContent = '@page{size:' + W + 'px ' + H + 'px;margin:0}html,body{width:' + W + 'px;height:' + H + 'px}';
  document.head.appendChild(st);
})();
</script>
</body>
</html>
